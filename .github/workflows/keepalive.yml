name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping listing-api (keeps the free Supabase project active)
        run: |
          curl -sS -o /dev/null -w "site-settings: %{http_code}\n" "https://mrngaqtbaseewzcsogqi.supabase.co/functions/v1/listing-api/api/site-settings" || true
          curl -sS -o /dev/null -w "listings: %{http_code}\n" "https://mrngaqtbaseewzcsogqi.supabase.co/functions/v1/listing-api/api/listings?limit=1" || true
          curl -sS -o /dev/null -w "vercel-market-scan: %{http_code}\n" "https://esrealty-market-scan.vercel.app/api/ping" || true
